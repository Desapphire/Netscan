<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NetScan NIDS{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #0d1117; color: #c9d1d9; }
        .navbar { background: #161b22 !important; border-bottom: 1px solid #30363d; }
        .card { background: #161b22; border: 1px solid #30363d; }
        .table { color: #c9d1d9; }
        .table thead th { border-bottom-color: #30363d; }
        .table td, .table th { border-color: #21262d; }
        .badge-critical { background: #da3633; }
        .badge-high { background: #d29922; }
        .badge-medium { background: #388bfd; }
        .badge-low { background: #3fb950; }
        .stat-card { text-align: center; padding: 1.5rem; }
        .stat-card h2 { font-size: 2.5rem; margin-bottom: 0.2rem; }
        a { color: #58a6ff; }
        a:hover { color: #79c0ff; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-shield-lock"></i> NetScan NIDS
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/">Dashboard</a>
                <a class="nav-link" href="/alerts">Alerts API</a>
                <a class="nav-link" href="/health">Health</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center text-secondary mt-5 mb-3">
        <small>NetScan &mdash; Metadata-only Network Intrusion Detection System &mdash; No payloads stored.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
