# ── Known false-positive / whitelisted domains ─────────────────────────────
# Add CDN/cloud domains here to prevent false positives, especially
# important now that port 443 is in the VPN TCP rule.
whitelist:
  # Google services
  - "google.com"
  - "googleapis.com"
  - "googlezip.net"
  - "gstatic.com"
  - "googlevideo.com"
  - "youtube.com"
  - "ytimg.com"
  # Microsoft / Windows Update
  - "microsoft.com"
  - "windowsupdate.com"
  - "live.com"
  - "office.com"
  - "office365.com"
  - "onedrive.com"
  # Apple
  - "apple.com"
  - "icloud.com"
  # Cloudflare
  - "cloudflare.com"
  - "cloudflare-dns.com"
  # Amazon / AWS
